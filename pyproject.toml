[tool.setuptools.packages.find]
include = ["src*"]
[tool.setuptools.package-data]
"src.prompts" = ["*.md"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gov-contract-bid-assistant"
version = "0.1.0"
description = "Finds federal solicitations, scores them against a company profile, and answers questions with citations."
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.0",
    "langchain-anthropic",
    "langchain-mcp-adapters",
    "langchain-community",
    "langchain-text-splitters",
    "langgraph",
    "pydantic>=2",
    "python-dotenv",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
    "httpx",
    "pypdf",
    "python-docx",
    "anthropic"
]
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]